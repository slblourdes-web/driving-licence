workflows:
  ios-compile-check:
    name: iOS Compile Check
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: 16.4
    scripts:
      - name: Compile DrivingStudy for iOS Simulator
        script: |
          xcodebuild \
            -project "DrivingStudy.xcodeproj" \
            -target "DrivingStudy" \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

  ios-unit-tests:
    name: iOS Unit Tests
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: 16.4
    scripts:
      - name: Diagnose available iOS Simulator destinations
        script: |
          xcrun simctl list devices available
          xcodebuild \
            -project "DrivingStudy.xcodeproj" \
            -scheme "DrivingStudy" \
            -showdestinations
      - name: Run DrivingStudyTests on an available iPhone Simulator
        script: |
          SIMULATOR_UDID="$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
            simulator = devices.find { |device| device["name"].start_with?("iPhone") }
            abort("No available iPhone Simulator was found") unless simulator
            puts simulator.fetch("udid")
          ')"
          echo "Selected iOS Simulator UDID: ${SIMULATOR_UDID}"
          xcodebuild test \
            -project "DrivingStudy.xcodeproj" \
            -scheme "DrivingStudy" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            -configuration Debug \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
