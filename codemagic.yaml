workflows:
  ios-compile-check:
    name: iOS Compile Check
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: 16.4
    scripts:
      - name: Compile DrivingStudy for iOS Simulator
        script: |
          xcodebuild \
            -project "DrivingStudy.xcodeproj" \
            -target "DrivingStudy" \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

  ios-unit-tests:
    name: iOS Unit Tests
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: 16.4
    scripts:
      - name: Run DrivingStudyTests on iPhone 16 Simulator
        script: |
          xcodebuild test \
            -project "DrivingStudy.xcodeproj" \
            -scheme "DrivingStudy" \
            -destination "platform=iOS Simulator,name=iPhone 16,OS=18.5" \
            -configuration Debug \
            -parallel-testing-enabled NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
